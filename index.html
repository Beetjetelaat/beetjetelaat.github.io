<!DOCTYPE html>
<html lang="nl">
<head>
  <!-- Met liefde gemaakt door TjouleL -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Beetje te laat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Spice&display=swap" rel="stylesheet" />
  <meta name="theme-color" content="#111" />
  <style>
    :root{
      --bg: #111;
      --accent: #ff7b00;
    }


    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: "Bungee Spice", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      position: relative;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }


    .center-wrap{
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 96vw;
      padding: 4vw;
      box-sizing: border-box;
    }

    .email {
      color: var(--accent);
      text-align: center;
      font-size: clamp(1rem, 6vw, 2.1rem);
      line-height: 1.05;
      max-width: 100%;
      word-break: break-word;
      overflow-wrap: anywhere;
      -webkit-user-select: text;
      user-select: text;
      white-space: normal;
    }


    .breath {
      position: fixed;
      top: 50dvh;
      left: 50vw;
      transform: translate3d(-50%,-50%,0);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,98,0,0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      will-change: transform, opacity;
      mix-blend-mode: screen;
    }


    .breath.b1 {
      width: clamp(140px, 28vmin, 520px);
      height: clamp(140px, 28vmin, 520px);
      animation: breathe 8s infinite ease-in-out;
      opacity: 0.5;
    }
    .breath.b2 {
      width: clamp(260px, 50vmin, 900px);
      height: clamp(260px, 50vmin, 900px);
      animation: breathe 8s infinite ease-in-out;
      animation-delay: -2s;
      opacity: 0.65;
    }
    .breath.b3 {
      width: clamp(400px, 80vmin, 1400px);
      height: clamp(400px, 80vmin, 1400px);
      animation: breathe 8s infinite ease-in-out;
      animation-delay: -4s;
      opacity: 0.42;
    }

    @keyframes breathe {
      0%, 100% { transform: translate3d(-50%,-50%,0) scale(0.82); opacity: 0.28; }
      50%     { transform: translate3d(-50%,-50%,0) scale(1.08); opacity: 0.62; }
    }


    @media (max-height: 520px) {
      .email { font-size: clamp(0.95rem, 5.5vw, 1.7rem); }
      .breath.b1 { width: clamp(110px, 24vmin, 380px); height: clamp(110px,24vmin,380px); }
      .breath.b2 { width: clamp(180px, 42vmin, 700px); height: clamp(180px,42vmin,700px); }
      .breath.b3 { width: clamp(260px, 70vmin, 1100px); height: clamp(260px,70vmin,1100px); }
    }


    @media (max-width: 360px) {
      .center-wrap { padding: 3vw; }
      .email { font-size: clamp(0.95rem, 6.5vw, 1.6rem); }
    }
  </style>
</head>
<body>
  <div class="breath b1" aria-hidden="true"></div>
  <div class="breath b2" aria-hidden="true"></div>
  <div class="breath b3" aria-hidden="true"></div>

  <div class="center-wrap">
    <div class="email">music.beetjetelaat@gmail.com</div>
  </div>
</body>
</html>
